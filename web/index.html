<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Investinews">
<meta name="description" content="Personal market news terminal: watches for tickers and topics, grouped events, push alerts.">
<title>Investinews</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<div id="app" class="app" aria-live="off">
  <header class="top" role="banner">
    <a class="brand" href="#/feed" aria-label="Investinews home">investi<span>news</span></a>
    <form id="cmd" class="cmd" role="search" autocomplete="off">
      <label for="cmdinput" class="sr-only">Command or search</label>
      <span class="cmd-prompt" aria-hidden="true">›</span>
      <input id="cmdinput" type="text" placeholder="watch NASDAQ:NVDA · JSE:NPN · AI export controls · help" spellcheck="false" autocapitalize="off" enterkeyhint="go">
      <button type="submit" class="btn btn-accent" aria-label="Run">go</button>
      <div id="cmdmenu" class="cmd-menu" hidden role="listbox"></div>
    </form>
    <div class="top-status">
      <span id="fresh" class="fresh" title="Measured source state">—</span>
      <button id="tzbtn" class="btn btn-ghost" title="Toggle time zone">SAST</button>
      <span id="clock" class="clock">--:--</span>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div class="body">
    <aside id="watches" class="pane pane-left" aria-label="Watches"></aside>
    <main id="main" class="pane pane-main" aria-label="Feed"></main>
    <aside id="detail" class="pane pane-right" aria-label="Details"></aside>
  </div>
  <nav class="mobile-nav" aria-label="Sections">
    <a href="#/watches">Watches</a><a href="#/feed" class="active">Feed</a><a href="#/search">Search</a><a href="#/sources">Sources</a><a href="#/settings">Settings</a>
  </nav>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
