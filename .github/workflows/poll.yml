name: poll
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  poll:
    runs-on: ubuntu-latest
    if: ${{ vars.POLL_ENABLED == 'true' }}
    steps:
      - name: Trigger poll job
        run: |
          curl -fsS -X POST "${{ secrets.POLL_URL }}" -H "X-Job-Token: ${{ secrets.JOB_TOKEN }}" | head -c 2000
